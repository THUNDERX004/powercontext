[project]
name = "sddctx"
version = "1.0.0"
description = "Spec-grounded context manager for continuous software evolution"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "powercontext[cli,server]==1.2.0",
    "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sddctx = "sddctx.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sddctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
