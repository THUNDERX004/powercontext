    - data:
        code: |
          def main(
              answer_markdown: str,
              remember_ok: bool,
              remember_status: str,
              remember_result: dict,
          ) -> dict:
              base = answer_markdown.strip()
              artifact_id = ""
              changed = False

              if isinstance(remember_result, dict):
                  records = remember_result.get("records")
                  if isinstance(records, list) and records:
                      first = records[0]
                      if isinstance(first, dict):
                          changed = bool(remember_result.get("changed"))
                          artifact = first.get("artifact")
                          if isinstance(artifact, dict):
                              artifact_id = str(artifact.get("artifact_id") or "")

              if remember_ok:
                  receipt = (
                      "\n\n---\n"
                      "🔐 灰灯馆长已把这件小事封存进 PowerContext。\n"
                      "馆藏编号：`" + (artifact_id or "已返回成功") + "`\n"
                      "本轮状态：" + (remember_status or "success")
                  )
              elif remember_status == "unknown":
                  receipt = (
                      "\n\n---\n"
                      "⚠️ 展品已经生成，但 PowerContext 没有返回确定的写入结果。\n"
                      "为避免重复写入，本轮没有自动重试。请先在 PowerContext 中核对，再继续。"
                  )
              else:
                  receipt = (
                      "\n\n---\n"
                      "⚠️ 展品已经生成，但本轮入藏未成功（状态："
                      + (remember_status or "error")
                      + "）。这次体验不会伪称记忆已经保存。"
                  )

              return {"final_answer": base + receipt}
