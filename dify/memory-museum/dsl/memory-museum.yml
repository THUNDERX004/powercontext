    - data:
        code: |
          def main(
              memory_text: str,
              prepare_ok: bool,
              prepare_status: str,
              prepare_result: dict,
          ) -> dict:
              memory = " ".join(memory_text.split()).strip()
              recalled = ""
              if prepare_ok and isinstance(prepare_result, dict):
                  content = prepare_result.get("content")
                  if isinstance(content, str):
                      recalled = " ".join(content.split()).strip()

              if recalled:
                  recall_state = "echo_found"
              elif prepare_status == "empty":
                  recall_state = "fresh_gallery"
              else:
                  recall_state = "memory_unavailable"

              return {
                  "memory_text": memory,
                  "recall_state": recall_state,
                  "prepare_status": prepare_status,
              }
        code_language: python3
        desc: 归一化当前输入和记忆召回状态，异常时允许作品继续生成但不得伪造历史。
